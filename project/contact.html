<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Decole Clinic</title>
    <link rel="stylesheet" href="styles/index.css">

<body>

        <div class="logo">
            <img src="images/logo.png" alt="Decole Psychopedagogical Clinic logo">
            <span>When learning creates wings</span>
        </div>
    
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
