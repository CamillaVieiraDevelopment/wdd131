<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Product Review</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review form for customer feedback on installation and features.">
    <meta name="author" content="Camilla Francianne Vieira">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>
                <label for="star1"><input type="radio" id="star1" name="rating" value="1" required> ☆</label>
                <label for="star2"><input type="radio" id="star2" name="rating" value="2" required> ☆☆</label>
                <label for="star3"><input type="radio" id="star3" name="rating" value="3" required> ☆☆☆</label>
                <label for="star4"><input type="radio" id="star4" name="rating" value="4" required> ☆☆☆☆</label>
                <label for="star5"><input type="radio" id="star5" name="rating" value="5" required> ☆☆☆☆☆</label>
            </fieldset>

            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Which features did you find useful?</legend>
                <label for="feature1"><input type="checkbox" id="feature1" name="features" value="Durability">
                    Durability</label>
                <label for="feature2"><input type="checkbox" id="feature2" name="features" value="Ease of Use"> Ease of
                    Use</label>
                <label for="feature3"><input type="checkbox" id="feature3" name="features" value="Performance">
                    Performance</label>
                <label for="feature4"><input type="checkbox" id="feature4" name="features" value="Design">
                    Design</label>
            </fieldset>

            <label for="review">Written Review</label>
            <textarea id="review" name="review"></textarea>

            <label for="username">Your Name</label>
            <input type="text" id="username" name="username">

            <input type="submit" value="Post Review">

        </form>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> | Camilla Francianne Vieira | Product Review Form</p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
